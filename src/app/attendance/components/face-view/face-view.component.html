<div class="fv-wrapper">

    <!-- Logo centered at top -->
    <img class="fv-logo" [src]="logoUrl" alt="Company Logo" />

    <!-- Full-screen camera feed -->
    <video #video autoplay playsinline muted class="fv-camera"></video>
    <canvas #canvas style="display:none;"></canvas>

    <!-- TEMP DEBUG -->
    <div style="position:absolute;top:60px;left:8px;z-index:999;background:rgba(0,0,0,0.7);color:#0f0;font-size:11px;padding:6px 8px;border-radius:6px;font-family:monospace;">
        {{ debugStatus }}
    </div>

    <!-- Clean Face Detection Loader - Center screen -->
    <div class="fv-heartbeat-loader" *ngIf="isLoading">
        <div class="face-scanner">
            <div class="face-frame">
                <div class="corner-bottom-left"></div>
                <div class="corner-bottom-right"></div>

                <div class="scanning-line-container">
                    <div class="scanning-line"></div>
                </div>
            </div>
        </div>
        <div class="loading-text">
            {{ loadingText }}<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>

    <!-- Attendance panel -->
    <div class="fv-attendance-panel" [class.visible]="showAttendance">
        <app-employee-attendance *ngIf="showAttendance"></app-employee-attendance>
    </div>

    <!-- Bottom bar -->
    <div class="fv-bottom-bar">
        <button class="fv-btn-show" (click)="toggleAttendance()">
            {{ showAttendance ? '⬆️ HIDE' : '📋 ATTENDANCE' }}
        </button>
        <button *ngIf="!autoMode" class="fv-btn-capture" (click)="captureAndSubmit()" [disabled]="isLoading">
            <svg class="camera-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V8C1 7.46957 1.21071 6.96086 1.58579 6.58579C1.96086 6.21071 2.46957 6 3 6H7L9 3H15L17 6H21C21.5304 6 22.0391 6.21071 22.4142 6.58579C22.7893 6.96086 23 7.46957 23 8V19Z"
                    stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="12" cy="13" r="4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <!-- Popups -->
    <div class="fv-popup fv-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="fv-popup fv-error" [class.fv-error-spoof]="isSpoofError" *ngIf="errorMessage">
        <span *ngIf="isSpoofError" class="fv-spoof-icon">🚫</span>{{ errorMessage }}
    </div>

</div>
