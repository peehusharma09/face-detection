<div *ngIf="isLoading" class="loader-container">
    <div class="fc-scanner">
        <div class="fc-frame">
            <div class="fc-corner fc-corner-tl"></div>
            <div class="fc-corner fc-corner-tr"></div>
            <div class="fc-corner fc-corner-bl"></div>
            <div class="fc-corner fc-corner-br"></div>
            <div class="fc-scan-line-container">
                <div class="fc-scan-line"></div>
            </div>
        </div>
        <div class="fc-loading-text">
            PROCESSING<span class="fc-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>
</div>
