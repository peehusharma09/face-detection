<div>
  <div class="top-wrapper p-4 ">
    <h5 class="employee-heading">Employees</h5>
    <div class="search-box">
      <input type="text" placeholder="Search By Name" (keyup)="Search($event)" [(ngModel)]="SearchVal" class="formcontrol search-input" name="" id="">
      <svg class="search-icon" width="17px" height="17px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="SVGRepo_iconCarrier">
          <path
            d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
            stroke="#707070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>
      </svg>
    </div>
  
  </div>
  <div class="all-detail-box" style="padding: 20px; gap: 20px;">
    <div class="top-box shadow rounded" *ngFor="let item of showEmployeeArr">
      <div class="main-card">
        <div class="icon-box"  *ngIf ="userInfoObj?.role !== 'employee' ">
          <div  class="dropdown-wrapper">
            <div class="profile-img-wrapper dropdown-toggle" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
              <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                  <path
                    d="M18 12H18.01M12 12H12.01M6 12H6.01M13 12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12C11 11.4477 11.4477 11 12 11C12.5523 11 13 11.4477 13 12ZM19 12C19 12.5523 18.5523 13 18 13C17.4477 13 17 12.5523 17 12C17 11.4477 17.4477 11 18 11C18.5523 11 19 11.4477 19 12ZM7 12C7 12.5523 6.55228 13 6 13C5.44772 13 5 12.5523 5 12C5 11.4477 5.44772 11 6 11C6.55228 11 7 11.4477 7 12Z"
                    stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </g>
              </svg>
            </div>
        </div>

        </div>
        <div class="display-box" *ngIf="item?.images?.length">
          <img [src]=" item?.images[0].url" class="display-pic">
          <div class="active-cls"></div>
        </div>
        <div class="display-box" *ngIf="!item?.images?.length">
          <img src="../../../../../../assets/house-amenities.jpg" class="display-pic">
          <div class="active-cls"></div>
        </div>

        <p class="text-1">{{item?.username || '--'}}</p>
        <p class="text-2">{{item?.designation || '--'}}</p>
        <p class="text-2">{{item?.officialId || '--'}}</p>
        <p class="p-box">Permanent</p>
        <p class="text-2">{{item?.email || '--'}}</p>
        <p class="text-2">{{item?.workShift || '--'}} work shift</p>

      </div>
    </div>

  </div>

</div>
